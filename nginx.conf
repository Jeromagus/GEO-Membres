# GEO Membres : configuration complète du serveur statique.
# Le conteneur tourne sans root (uid 101) et en lecture seule : nginx n'écrit que
# dans /tmp, et écoute sur 8080.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json text/plain text/xml;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Traefik termine le TLS : une redirection relative garde le poste en https.
    absolute_redirect off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Le contrôle de santé (wget de busybox) n'est pas journalisé.
    map $http_user_agent $journaliser {
        "Wget"   0;
        default  1;
    }
    access_log /dev/stdout combined if=$journaliser;

    # Relais Google : au plus 20 géocodages par seconde par poste, et 100 tuiles.
    limit_req_zone $binary_remote_addr zone=geocode:1m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=tiles:1m rate=100r/s;

    # Session de tuiles Google selon la variante demandée (?type=), en français.
    # Mêmes réglages que SESSION_BODIES dans vite.config.ts. Le satellite est refusé
    # aux comptes de l'Espace économique européen.
    map $arg_type $google_tiles_session {
        epure     '{"mapType":"roadmap","language":"fr-FR","region":"FR","styles":[{"featureType":"poi","stylers":[{"visibility":"off"}]},{"featureType":"poi.park","elementType":"geometry","stylers":[{"visibility":"on"}]},{"featureType":"transit","stylers":[{"visibility":"off"}]}]}';
        gris      '{"mapType":"roadmap","language":"fr-FR","region":"FR","styles":[{"stylers":[{"saturation":-100}]},{"featureType":"poi","elementType":"labels","stylers":[{"visibility":"off"}]},{"featureType":"transit","stylers":[{"visibility":"off"}]}]}';
        terrain   '{"mapType":"terrain","layerTypes":["layerRoadmap"],"language":"fr-FR","region":"FR"}';
        default   '{"mapType":"roadmap","language":"fr-FR","region":"FR"}';
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Appels vers Google (relais ci-dessous) : DNS de Docker, certificat vérifié,
        # ni cookie ni provenance transmis.
        resolver 127.0.0.11 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";

        # add_header ne s'hérite pas d'un location à l'autre : chacun porte la liste.

        # Fichiers à empreinte produits par Vite : cache long.
        location /geo-membres/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # index.html jamais en cache : un redéploiement est vu immédiatement.
        location /geo-membres/ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /geo-membres/index.html;
        }

        # Relais vers Google : la clé reste sur le serveur (fichier écrit au démarrage par
        # start.sh depuis GOOGLE_MAPS_KEY), jamais dans le navigateur. Sans clé : 503.
        # Les erreurs d'amont citeraient l'URL appelée, clé comprise : pas de journal
        # d'erreurs sur ces routes (le client voit le code et retente).

        # Géocodage : seuls address et components sont transmis.
        location = /geo-membres/api/geocode {
            include /tmp/google-key.conf;
            if ($google_key = "") {
                return 503;
            }
            limit_req zone=geocode burst=40 nodelay;
            limit_req_status 429;
            limit_except GET { deny all; }
            error_log /dev/stderr crit;

            proxy_pass https://maps.googleapis.com/maps/api/geocode/json?address=$arg_address&components=$arg_components&language=fr&key=$google_key;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Fonds de carte (Map Tiles API) : ouverture d'une session.
        # Le navigateur fait un GET, le relais envoie le POST attendu par Google.
        location = /geo-membres/api/tiles/session {
            include /tmp/google-key.conf;
            if ($google_key = "") {
                return 503;
            }
            limit_req zone=geocode burst=10 nodelay;
            limit_req_status 429;
            limit_except GET { deny all; }
            error_log /dev/stderr crit;

            proxy_method POST;
            proxy_set_header Content-Type "application/json";
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_set_body $google_tiles_session;
            proxy_pass https://tile.googleapis.com/v1/createSession?key=$google_key;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Mentions de droits à afficher pour la zone visible (obligatoires).
        location = /geo-membres/api/tiles/viewport {
            include /tmp/google-key.conf;
            if ($google_key = "") {
                return 503;
            }
            limit_req zone=geocode burst=20 nodelay;
            limit_req_status 429;
            limit_except GET { deny all; }
            error_log /dev/stderr crit;

            proxy_pass https://tile.googleapis.com/tile/v1/viewport?session=$arg_session&zoom=$arg_zoom&north=$arg_north&south=$arg_south&east=$arg_east&west=$arg_west&key=$google_key;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Tuiles : /geo-membres/api/tiles/{z}/{x}/{y}?session=… (en-têtes de cache de Google conservés).
        location ~ "^/geo-membres/api/tiles/(?<tile_z>[0-9]{1,2})/(?<tile_x>[0-9]{1,8})/(?<tile_y>[0-9]{1,8})$" {
            include /tmp/google-key.conf;
            if ($google_key = "") {
                return 503;
            }
            if ($arg_session !~ "^[A-Za-z0-9_-]{8,512}$") {
                return 400;
            }
            limit_req zone=tiles burst=300 nodelay;
            limit_req_status 429;
            limit_except GET { deny all; }
            error_log /dev/stderr crit;

            proxy_pass https://tile.googleapis.com/v1/2dtiles/$tile_z/$tile_x/$tile_y?session=$arg_session&key=$google_key;

            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /geo-membres {
            return 301 /geo-membres/;
        }

        # Traefik n'envoie ici que PathPrefix(/geo-membres) : le reste est hors périmètre.
        location / {
            return 404;
        }
    }
}
