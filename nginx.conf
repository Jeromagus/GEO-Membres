# GEO Membres : configuration complète du serveur statique.
# Le conteneur tourne sans root (uid 101) et en lecture seule : nginx n'écrit que
# dans /tmp, et écoute sur 8080.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json text/plain text/xml;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Traefik termine le TLS : une redirection relative garde le poste en https.
    absolute_redirect off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Le contrôle de santé (wget de busybox) n'est pas journalisé.
    map $http_user_agent $journaliser {
        "Wget"   0;
        default  1;
    }
    access_log /dev/stdout combined if=$journaliser;

    # Relais de géocodage Google : au plus 20 requêtes par seconde par poste.
    limit_req_zone $binary_remote_addr zone=geocode:1m rate=20r/s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # add_header ne s'hérite pas d'un location à l'autre : chacun porte la liste.

        # Fichiers à empreinte produits par Vite : cache long.
        location /geo-membres/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # index.html jamais en cache : un redéploiement est vu immédiatement.
        location /geo-membres/ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /geo-membres/index.html;
        }

        # Relais vers Google Geocoding : la clé reste sur le serveur (fichier écrit au
        # démarrage par start.sh depuis GOOGLE_MAPS_KEY), jamais dans le navigateur.
        # Seuls les paramètres address et components sont transmis.
        location = /geo-membres/api/geocode {
            include /tmp/google-key.conf;
            if ($google_key = "") {
                return 503;
            }
            limit_req zone=geocode burst=40 nodelay;
            limit_req_status 429;
            limit_except GET { deny all; }
            # Les erreurs d'amont citent l'URL appelée, clé comprise : pas de journal ici
            # (le client voit le code d'erreur et retente).
            error_log /dev/stderr crit;

            resolver 127.0.0.11 valid=300s ipv6=off;
            proxy_pass https://maps.googleapis.com/maps/api/geocode/json?address=$arg_address&components=$arg_components&language=fr&key=$google_key;
            proxy_set_header Host maps.googleapis.com;
            proxy_set_header Cookie "";
            proxy_set_header Referer "";
            proxy_ssl_server_name on;
            proxy_ssl_name maps.googleapis.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 4;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /geo-membres {
            return 301 /geo-membres/;
        }

        # Traefik n'envoie ici que PathPrefix(/geo-membres) : le reste est hors périmètre.
        location / {
            return 404;
        }
    }
}
